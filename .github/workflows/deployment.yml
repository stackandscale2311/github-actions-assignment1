name: Deployment 
on: push

jobs: 
 lint:
 runs-on: ubuntu-latest
 steps: 
  - name: Get Code
    uses: actions/checkout@v7
  - name: Setup NodeJS
    uses: actions/setup-node@v5
    with: 
     node-version: 22
  - name: Install Dependencies
    run: npm ci
  - name: Run Lint
    run: npm run lint
 test: 
 runs-on: ubuntu-latest
 steps: 
  - name: Get Code
    uses: actions/checkout@v7
  - name: Setup NodeJS
    uses: actions/setup-node@v5
    with: 
     node-version: 22
  - name: Install Dependencies
    run: npm ci
  - name: Run Tests
    run: npm run test
 deploy: 
  runs-on: ubuntu-latest
  needs: [lint, test]
  steps: 
   - name: Get Code
     uses: actions/checkout@v7
   - name: Setup NodeJS
     uses: actions/setup-node@v5
     with: 
      node-version: 22
   - name: Build
     run: npm run build
   - name: Deploy
     run: echo "Deploying ..."